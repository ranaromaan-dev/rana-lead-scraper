server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/yaml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  location = /app.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  location = /styles.css {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

# Google Maps API
location ^~ /api/ {
    proxy_pass http://gmaps:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}

# Google Maps API documentation assets
location ^~ /static/ {
    proxy_pass http://gmaps:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Old Google Maps UI URL ko custom frontend par bhejo
location = /google-maps-ui {
    return 302 /#lead-collector;
}

location = /google-maps-ui/ {
    return 302 /#lead-collector;
}

# Crawl4AI health — only required endpoint
location = /crawl4ai/health {
    proxy_pass http://crawl4ai:11235/health;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Crawl4AI synchronous crawl API
location = /crawl4ai/crawl {
    proxy_pass http://crawl4ai:11235/crawl;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# Playground ko custom frontend par redirect karo
location = /crawl4ai/playground {
    return 302 /#lead-collector;
}

# Main custom frontend
location / {
    try_files $uri $uri/ /index.html;
}
}
